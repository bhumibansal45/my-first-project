<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            background-color: #f5f5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 330px;
            background-color: white;
            padding: 30px;
            text-align: center;
            border: 1px solid #333;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #111;
            margin-top: 0;
        }

        .profile {
            width: 140px;
            height: 140px;
            border: 3px solid #111;
            border-radius: 50%;
            margin: 20px auto;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        button {
            background-color: #1d27c9;
            color: white;
            border: 2px solid #111;
            border-radius: 6px;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #111;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Student Profile</h1>

        <div class="profile"></div>

        <h2>Bhumi Bansal</h2>

        <p>Welcome to my student profile!</p>

        <div>
            <button>Show Details</button>
            <button>Change Theme</button>
        </div>

        <div>
            <button>Add Message</button>
            <button>Update Name</button>
        </div>

    </div>

</body>
</html>
